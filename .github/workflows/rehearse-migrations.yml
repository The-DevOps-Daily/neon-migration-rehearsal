name: Rehearse migrations

# The rehearsal code and its dependencies come from the base branch, never from the pull
# request: a pull request could otherwise change a script or package.json and read the key.
# The only thing taken from the pull request is the SQL of the migrations it adds or changes.
#
# A pull request from this repository can still change this workflow file, and a changed
# workflow runs. So the key is not a repository secret: it lives in the migration-rehearsal
# environment, which needs a reviewer to approve each run before the job gets it. Approve only
# after reading the workflow diff. The key itself is scoped to this one Neon project.

on:
  pull_request:
    paths:
      - 'migrations/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: rehearse-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rehearse:
    # Pull requests from forks get no secrets; only rehearse branches of this repository.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: migration-rehearsal
    timeout-minutes: 20
    steps:
      - name: Check out the base branch (trusted code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - run: npm ci --ignore-scripts

      - name: Take only the pull request's migration files, in order
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$HEAD_SHA"
          dir="$RUNNER_TEMP/pr-migrations"
          mkdir -p "$dir"
          # Added, copied, modified and renamed files, NUL-separated so no file name can split.
          # A rename or copy prints two paths; the second is the new one.
          git diff -z --name-status --diff-filter=ACMR "$BASE_SHA...$HEAD_SHA" -- migrations/ > "$RUNNER_TEMP/changed"
          names=""
          while IFS= read -r -d '' status; do
            IFS= read -r -d '' path
            case "$status" in R* | C*) IFS= read -r -d '' path ;; esac
            # A file name must not be able to write workflow commands into the log.
            shown=$(printf '%s' "$path" | tr -c 'A-Za-z0-9_./-' '?')
            case "$path" in
              migrations/*/*) echo "::notice::Not rehearsed: $shown (only files directly in migrations/ are migrations)"; continue ;;
              *.sql) ;;
              *) echo "::notice::Not rehearsed: $shown (not a .sql file)"; continue ;;
            esac
            name="${path#migrations/}"
            if [ "$shown" != "$path" ] || ! printf '%s' "$name" | grep -Eq '^[A-Za-z0-9_.-]+\.sql$'; then
              echo "::error::Migration file names may use only letters, digits, '_', '.' and '-': $shown"
              exit 1
            fi
            git show "$HEAD_SHA:$path" > "$dir/$name"
            names="$names$name"$'\n'
          done < "$RUNNER_TEMP/changed"
          # Names are checked above, so a newline-separated sort is safe. Order is the file name order.
          files=$(printf '%s' "$names" | sort | sed "s|^|$dir/|" | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          [ -n "$files" ] || echo "::notice::This pull request changes no migration in migrations/."

      - name: Rehearse on a Neon branch of production
        if: steps.changed.outputs.files != ''
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          PRODUCTION_BRANCH: main
          FILES: ${{ steps.changed.outputs.files }}
        # --public is automatic on GitHub Actions: no Postgres error DETAIL (row values) in the log or comment
        run: node scripts/rehearse.mjs --sequence $FILES --markdown "$RUNNER_TEMP/rehearsal.md"

      - name: Post the result on the pull request
        if: always() && steps.changed.outputs.files != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          body="$RUNNER_TEMP/rehearsal.md"
          test -f "$body" || echo "The rehearsal did not finish. See the workflow log." > "$body"
          gh pr comment "$PR" --repo "$REPO" --body-file "$body" --edit-last 2>/dev/null \
            || gh pr comment "$PR" --repo "$REPO" --body-file "$body"
